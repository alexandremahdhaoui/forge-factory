name: factory-lang-rust
kind: mcp-server
version: 0.1.0
description: Render Rust manifests from the workspace composition.
openapi:
  specPath: ../../api/factory.v1.yaml
generate:
  packageName: main
  docsBaseURL: https://raw.githubusercontent.com/alexandremahdhaoui/forge-factory/refs/heads/main
layout:
  tools:
    - name: language
      description: Report which language this engine speaks.
      input: RenderInput
      output: LanguageOutput
    - name: render
      description: Render every rust manifest the workspace needs.
      input: RenderInput
      output: RenderOutput
    - name: describe
      description: Describe the runtime this language's members exec - artifacts, layout, env, prerequisites. Pure data.
      input: DescribeInput
      output: RuntimeDescription
