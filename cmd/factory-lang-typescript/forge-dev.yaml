name: factory-lang-typescript
type: generic
version: 0.1.0
description: Render TypeScript manifests from the workspace composition.
openapi:
  specPath: ../../api/factory.v1.yaml
generate:
  packageName: main
  docsBaseURL: https://raw.githubusercontent.com/alexandremahdhaoui/forge-factory/refs/heads/main
  tools:
    - name: language
      description: Report which language this engine speaks.
      input: RenderInput
      output: LanguageOutput
    - name: render
      description: Render every typescript manifest the workspace needs.
      input: RenderInput
      output: RenderOutput
