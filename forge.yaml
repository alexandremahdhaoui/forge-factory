name: forge-factory

artifactStorePath: .forge/artifact-store.yaml

build:
  - name: gen-factory-lang-go
    src: ./cmd/factory-lang-go
    engine: forge://forge-dev

  - name: gen-factory-lang-rust
    src: ./cmd/factory-lang-rust
    engine: forge://forge-dev

  - name: gen-factory-lang-python
    src: ./cmd/factory-lang-python
    engine: forge://forge-dev

  - name: gen-factory-lang-typescript
    src: ./cmd/factory-lang-typescript
    engine: forge://forge-dev

  - name: generate-mocks
    src: .
    engine: forge://generic-builder
    spec:
      command: mockery

  - name: generate-docs
    src: .
    engine: forge://generic-builder
    spec:
      command: go
      args: ["run", "./cmd/docgen"]

  - name: format-code
    src: .
    engine: forge://go-format

  - name: forge-factory
    src: ./cmd/forge-factory
    dest: ./build/bin
    engine: forge://go-build
    platforms: [linux/amd64, linux/arm64]

  - name: factory-lang-go
    src: ./cmd/factory-lang-go
    dest: ./build/bin
    engine: forge://go-build
    platforms: [linux/amd64, linux/arm64]

  - name: factory-lang-rust
    src: ./cmd/factory-lang-rust
    dest: ./build/bin
    engine: forge://go-build
    platforms: [linux/amd64, linux/arm64]

  - name: factory-lang-python
    src: ./cmd/factory-lang-python
    dest: ./build/bin
    engine: forge://go-build
    platforms: [linux/amd64, linux/arm64]

  - name: factory-lang-typescript
    src: ./cmd/factory-lang-typescript
    dest: ./build/bin
    engine: forge://go-build
    platforms: [linux/amd64, linux/arm64]

# The CLI as a first class run target. Every toolchain runnable declares
# forge-self-factory: the model has no exceptions.
run:
  - name: forge-factory
    src: ./cmd/forge-factory
    factory: git@github.com:alexandremahdhaoui/forge-self-factory.git

test:
  - name: lint
    runner: forge://go-lint

  - name: standalone
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/standalone.sh"]

  - name: unwired
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/unwired.sh"]

  - name: architecture
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/architecture.sh"]

  - name: engine-docs
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/engine-docs.sh"]

  - name: docs
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/docs-check.sh"]

  - name: unit
    runner: forge://go-test

  # The same tests as somebody who cannot write to /. Three times now a unit
  # test named an absolute path, passed here as root, and failed on a
  # colleague's machine. A grep cannot tell a literal handed to a mock from
  # the same literal handed to real code; this can.
  - name: unit-nonroot
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/unit-nonroot.sh"]

  - name: integration
    runner: forge://go-test
    spec:
      tags: [integration]
      packages: [./test/integration/...]

  - name: e2e
    runner: forge://go-test
    spec:
      tags: [e2e]
      packages: [./test/e2e/...]
      timeout: "15m"

  - name: coverage
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/coverage.sh", "95"]

  # The distribution build: every command cross-built CGO-off for the
  # release, named by the <name>_<os>_<arch> travel convention. The
  # pipeline's release stage globs build/dist into the aggregated release.
  - name: dist
    runner: forge://generic-test-runner
    spec:
      command: forge
      args: ["build", "--platforms", "linux/amd64,linux/arm64"]

# forge-factory keeps its own go.mod. It is what materialises everything else,
# so it is the one repo that has to build from a lone checkout. Membership is
# still generated.
factory:
  module: github.com/alexandremahdhaoui/forge-factory
  goVersion: "1.26.5"
  manifest: own
